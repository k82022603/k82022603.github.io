<svg width="680" height="820" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" role="img">
<title>그래프, 루프, 하네스가 하나의 예시 안에서 어떻게 결합되는지 보여주는 드릴다운 다이어그램</title>
<desc>그래프의 한 단계를 확대하면 루프가 있고, 루프의 시도 한 번을 확대하면 하네스와 모델이 있는 구조를 보여준다</desc>

<style>
  .bg { fill: #FFFFFF; }
  .t  { font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 14px; font-weight: 400; fill: #2C2C2A; }
  .ts { font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .th { font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 14px; font-weight: 700; fill: #2C2C2A; }
  .box { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.5; }
  .c-gray  rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray  .th, .c-gray .t { fill: #2C2C2A; }
  .c-gray  .ts { fill: #444441; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th, .c-coral .t { fill: #4A1B0C; }
  .c-coral .ts { fill: #712B13; }
  .c-teal  rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal  .th, .c-teal .t { fill: #04342C; }
  .c-teal  .ts { fill: #085041; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th, .c-purple .t { fill: #26215C; }
  .c-purple .ts { fill: #3C3489; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>

<rect class="bg" x="0" y="0" width="680" height="820"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- LEGEND -->
<g class="c-gray"><rect x="40" y="44" width="14" height="14" rx="3"/></g>
<text class="ts" x="60" y="55">모델</text>
<g class="c-coral"><rect x="180" y="44" width="14" height="14" rx="3"/></g>
<text class="ts" x="200" y="55">하네스</text>
<g class="c-teal"><rect x="320" y="44" width="14" height="14" rx="3"/></g>
<text class="ts" x="340" y="55">루프</text>
<g class="c-purple"><rect x="460" y="44" width="14" height="14" rx="3"/></g>
<text class="ts" x="480" y="55">그래프</text>

<!-- CONTAINER A: GRAPH -->
<rect class="box" x="40" y="90" width="600" height="170" rx="12" stroke-dasharray="4 4" stroke-width="0.5"/>
<text class="th" x="55" y="110">그래프 - 전체 작업 흐름 (5단계 파이프라인)</text>

<g class="c-purple"><rect x="63" y="140" width="105" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="115" y="164" text-anchor="middle">자료수집</text>
<text class="ts" x="115" y="184" text-anchor="middle">출처정보수집</text></g>

<g class="c-purple"><rect x="178" y="140" width="105" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="230" y="164" text-anchor="middle">사실검증</text>
<text class="ts" x="230" y="184" text-anchor="middle">사실대조확인</text></g>

<g class="c-purple"><rect x="293" y="140" width="105" height="56" rx="8" stroke-width="2"/>
<text class="th" x="345" y="164" text-anchor="middle">초안작성</text>
<text class="ts" x="345" y="184" text-anchor="middle">초안구조화</text></g>

<g class="c-purple"><rect x="408" y="140" width="105" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="460" y="164" text-anchor="middle">사람검토</text>
<text class="ts" x="460" y="184" text-anchor="middle">품질검토</text></g>

<g class="c-purple"><rect x="523" y="140" width="105" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="575" y="164" text-anchor="middle">게시</text>
<text class="ts" x="575" y="184" text-anchor="middle">승인후공개</text></g>

<line x1="168" y1="168" x2="178" y2="168" class="arr" marker-end="url(#arrow)"/>
<line x1="283" y1="168" x2="293" y2="168" class="arr" marker-end="url(#arrow)"/>
<line x1="398" y1="168" x2="408" y2="168" class="arr" marker-end="url(#arrow)"/>
<line x1="513" y1="168" x2="523" y2="168" class="arr" marker-end="url(#arrow)"/>

<!-- CONNECTOR A -> B -->
<line x1="345" y1="196" x2="345" y2="298" stroke="#534AB7" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="360" y="255">그래프의 '초안작성' 단계를</text>
<text class="ts" x="360" y="272">확대하면 그 안에 루프가 있다</text>

<!-- CONTAINER B: LOOP -->
<rect class="box" x="40" y="300" width="600" height="220" rx="12" stroke-dasharray="4 4" stroke-width="0.5"/>
<text class="th" x="55" y="320">루프 - '초안작성' 단계 안의 검증 순환</text>

<g class="c-teal"><rect x="95" y="350" width="150" height="54" rx="8" stroke-width="2"/>
<text class="th" x="170" y="372" text-anchor="middle">시도</text>
<text class="ts" x="170" y="392" text-anchor="middle">AI가 초안을 씀</text></g>

<g class="c-teal"><rect x="265" y="350" width="150" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="372" text-anchor="middle">점검</text>
<text class="ts" x="340" y="392" text-anchor="middle">사실과 대조</text></g>

<g class="c-teal"><rect x="435" y="350" width="150" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="372" text-anchor="middle">피드백</text>
<text class="ts" x="510" y="392" text-anchor="middle">틀린 부분 표시</text></g>

<line x1="245" y1="377" x2="265" y2="377" class="arr" marker-end="url(#arrow)"/>
<line x1="415" y1="377" x2="435" y2="377" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="440" text-anchor="middle">↻ 부정적이면 시도로 복귀, 긍정적이면 다음 그래프 단계로 진행</text>

<!-- CONNECTOR B -> C -->
<line x1="170" y1="404" x2="170" y2="558" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="185" y="475">루프의 '시도' 한 번을</text>
<text class="ts" x="185" y="492">확대하면 그 안에 하네스가 있다</text>

<!-- CONTAINER C: HARNESS + MODEL -->
<rect class="box" x="40" y="560" width="600" height="220" rx="12" stroke-dasharray="4 4" stroke-width="0.5"/>
<text class="th" x="55" y="580">하네스 - '시도' 한 번이 쓰는 장비와 모델</text>

<g class="c-coral"><rect x="78" y="610" width="165" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="632" text-anchor="middle">도구</text>
<text class="ts" x="160" y="650" text-anchor="middle">문서·소스 검색</text></g>

<g class="c-coral"><rect x="258" y="610" width="165" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="632" text-anchor="middle">메모리</text>
<text class="ts" x="340" y="650" text-anchor="middle">이전 초안 기억</text></g>

<g class="c-coral"><rect x="438" y="610" width="165" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="520" y="632" text-anchor="middle">권한</text>
<text class="ts" x="520" y="650" text-anchor="middle">출처 수정 불가</text></g>

<path d="M160 660 L300 700" stroke="#993C1D" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<path d="M340 660 L340 700" stroke="#993C1D" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<path d="M520 660 L380 700" stroke="#993C1D" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="280" y="700" width="120" height="50" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="722" text-anchor="middle">AI 모델</text>
<text class="ts" x="340" y="740" text-anchor="middle">고정된 지능</text></g>

<text class="ts" x="340" y="800" text-anchor="middle" fill="#888780">그래프의 한 단계 → 그 안의 루프 → 루프가 쓰는 하네스 → 하네스가 감싸는 모델</text>
</svg>
